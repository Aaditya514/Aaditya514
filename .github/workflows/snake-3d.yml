name: Generate 3D Snake

on:
  # Daily, 18:00 UTC
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/snake3d.py"
      - ".github/workflows/snake-3d.yml"

permissions:
  contents: write

# Share one lock with the activity updater so the two never push at once
concurrency:
  group: profile-commit
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D snake
        run: python3 .github/scripts/snake3d.py --out assets/snake-3d.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-3d.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update 3D snake [skip ci]"
            git pull --rebase
            git push
          fi

name: Generate Stats Card

on:
  # Every 6 hours
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

# Share one lock with the other profile workflows so they never push at once
concurrency:
  group: profile-commit
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate stats card
        run: python3 .github/scripts/stats.py --out assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats card [skip ci]"
            git pull --rebase
            git push
          fi
